<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1600" width="2400" height="1600" fill="none">
  <defs>
    <!-- 45-degree architectural hatch pattern for aluminium section walls -->
    <pattern id="hatch_light" width="16" height="16" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="16" stroke="#00a9c9" stroke-width="1.2" opacity="0.45" />
    </pattern>
    <!-- Concrete substrate hatch -->
    <pattern id="concrete_light" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="6" r="1.5" fill="#00a9c9" opacity="0.3" />
      <circle cx="16" cy="18" r="1.2" fill="#00a9c9" opacity="0.3" />
      <path d="M12 4 L16 8 M2 20 L6 16" stroke="#00a9c9" stroke-width="1" opacity="0.3" />
    </pattern>
    <!-- Radial fade mask so blueprint blends smoothly into page background -->
    <radialGradient id="fade_light" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#fff" stop-opacity="1" />
      <stop offset="65%" stop-color="#fff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#fff" stop-opacity="0" />
    </radialGradient>
    <mask id="blueprint_mask_light">
      <rect width="2400" height="1600" fill="url(#fade_light)" />
    </mask>
  </defs>

  <g mask="url(#blueprint_mask_light)" opacity="0.14">
    <!-- Background Cadastral Modular Grid -->
    <g stroke="#00a9c9" stroke-width="0.75" opacity="0.06">
      <!-- Horizontal grid lines every 80px -->
      <line x1="0" y1="0" x2="2400" y2="0"/> <line x1="0" y1="80" x2="2400" y2="80"/> <line x1="0" y1="160" x2="2400" y2="160"/> <line x1="0" y1="240" x2="2400" y2="240"/> <line x1="0" y1="320" x2="2400" y2="320"/> <line x1="0" y1="400" x2="2400" y2="400"/> <line x1="0" y1="480" x2="2400" y2="480"/> <line x1="0" y1="560" x2="2400" y2="560"/> <line x1="0" y1="640" x2="2400" y2="640"/> <line x1="0" y1="720" x2="2400" y2="720"/> <line x1="0" y1="800" x2="2400" y2="800"/> <line x1="0" y1="880" x2="2400" y2="880"/> <line x1="0" y1="960" x2="2400" y2="960"/> <line x1="0" y1="1040" x2="2400" y2="1040"/> <line x1="0" y1="1120" x2="2400" y2="1120"/> <line x1="0" y1="1200" x2="2400" y2="1200"/> <line x1="0" y1="1280" x2="2400" y2="1280"/> <line x1="0" y1="1360" x2="2400" y2="1360"/> <line x1="0" y1="1440" x2="2400" y2="1440"/> <line x1="0" y1="1520" x2="2400" y2="1520"/> <line x1="0" y1="1600" x2="2400" y2="1600"/>
      <!-- Vertical grid lines every 80px -->
      <line x1="0" y1="0" x2="0" y2="1600"/> <line x1="80" y1="0" x2="80" y2="1600"/> <line x1="160" y1="0" x2="160" y2="1600"/> <line x1="240" y1="0" x2="240" y2="1600"/> <line x1="320" y1="0" x2="320" y2="1600"/> <line x1="400" y1="0" x2="400" y2="1600"/> <line x1="480" y1="0" x2="480" y2="1600"/> <line x1="560" y1="0" x2="560" y2="1600"/> <line x1="640" y1="0" x2="640" y2="1600"/> <line x1="720" y1="0" x2="720" y2="1600"/> <line x1="800" y1="0" x2="800" y2="1600"/> <line x1="880" y1="0" x2="880" y2="1600"/> <line x1="960" y1="0" x2="960" y2="1600"/> <line x1="1040" y1="0" x2="1040" y2="1600"/> <line x1="1120" y1="0" x2="1120" y2="1600"/> <line x1="1200" y1="0" x2="1200" y2="1600"/> <line x1="1280" y1="0" x2="1280" y2="1600"/> <line x1="1360" y1="0" x2="1360" y2="1600"/> <line x1="1440" y1="0" x2="1440" y2="1600"/> <line x1="1520" y1="0" x2="1520" y2="1600"/> <line x1="1600" y1="0" x2="1600" y2="1600"/> <line x1="1680" y1="0" x2="1680" y2="1600"/> <line x1="1760" y1="0" x2="1760" y2="1600"/> <line x1="1840" y1="0" x2="1840" y2="1600"/> <line x1="1920" y1="0" x2="1920" y2="1600"/> <line x1="2000" y1="0" x2="2000" y2="1600"/> <line x1="2080" y1="0" x2="2080" y2="1600"/> <line x1="2160" y1="0" x2="2160" y2="1600"/> <line x1="2240" y1="0" x2="2240" y2="1600"/> <line x1="2320" y1="0" x2="2320" y2="1600"/> <line x1="2400" y1="0" x2="2400" y2="1600"/>
    </g>

    <!-- SECTION 1: DETAILED CONTINUOUS CHANNEL CROSS-SECTION (PR 08 CP / PR 19 CP) -->
    <!-- Base center at (460, 1120) -->
    <g transform="translate(180, 260)" stroke="#00a9c9" stroke-width="1.75">
      <!-- Concrete Slab Substrate -->
      <rect x="0" y="800" width="600" height="180" fill="url(#concrete_light)" stroke="#00a9c9" stroke-dasharray="8,4" />
      <line x1="-40" y1="800" x2="640" y2="800" stroke-width="2.5" />
      <text x="300" y="850" font-family="'Inter', monospace" font-size="14" fill="#0087a3" text-anchor="middle" letter-spacing="0.1em">RCC SLAB DATUM LEVEL ±0.00</text>

      <!-- Extruded Aluminium Base Channel Profile (Outer walls) -->
      <!-- Profile Base Width = 220px, Height = 320px -->
      <path d="M 190 800 L 190 540 Q 195 480 230 480 L 370 480 Q 405 480 410 540 L 410 800 Z" fill="url(#hatch_light)" stroke-width="2.5" />
      
      <!-- Inner Cavity & Hollow Chambers -->
      <path d="M 220 780 L 220 620 L 270 620 L 270 780 Z" fill="none" stroke-width="1.5" />
      <path d="M 330 780 L 330 620 L 380 620 L 380 780 Z" fill="none" stroke-width="1.5" />
      
      <!-- Glass Channel Slot -->
      <rect x="275" y="480" width="50" height="240" fill="none" stroke-width="2" />
      <!-- EPDM Rubber Gasket Packing -->
      <rect x="275" y="520" width="10" height="180" stroke-width="1" stroke-dasharray="3,2" />
      <rect x="315" y="520" width="10" height="180" stroke-width="1" stroke-dasharray="3,2" />

      <!-- 12mm Toughened Glass Pane extending upward -->
      <rect x="287" y="60" width="26" height="660" fill="none" stroke-width="2.5" />
      <!-- Polished Glass Bevel Edge -->
      <line x1="287" y1="60" x2="313" y2="60" stroke-width="3" />
      
      <!-- Centerline axis (long-dash-dot) -->
      <line x1="300" y1="20" x2="300" y2="920" stroke="#00a9c9" stroke-width="1.2" stroke-dasharray="16,4,4,4" />

      <!-- Anchor Bolt in Concrete -->
      <rect x="288" y="780" width="24" height="130" stroke-width="1.5" />
      <path d="M 276 910 L 300 940 L 324 910 Z" stroke-width="1.5" />
      <line x1="288" y1="810" x2="312" y2="830" stroke-width="1" />
      <line x1="288" y1="840" x2="312" y2="860" stroke-width="1" />
      <line x1="288" y1="870" x2="312" y2="890" stroke-width="1" />

      <!-- Dimension Lines & Annotations -->
      <!-- Width Dimension -->
      <g stroke-width="1" font-family="'Inter', monospace" font-size="13" fill="#0087a3">
        <line x1="190" y1="825" x2="410" y2="825" />
        <line x1="190" y1="815" x2="190" y2="835" />
        <line x1="410" y1="815" x2="410" y2="835" />
        <text x="300" y="842" text-anchor="middle">BASE WIDTH 70.0 mm</text>
        
        <!-- Height Dimension -->
        <line x1="435" y1="480" x2="435" y2="800" />
        <line x1="425" y1="480" x2="445" y2="480" />
        <line x1="425" y1="800" x2="445" y2="800" />
        <text x="450" y="645" transform="rotate(90 450 645)" text-anchor="middle">OVERALL PROFILE H = 125.0 mm</text>

        <!-- Glass Seating Depth -->
        <line x1="165" y1="480" x2="165" y2="720" />
        <line x1="155" y1="480" x2="175" y2="480" />
        <line x1="155" y1="720" x2="175" y2="720" />
        <text x="150" y="605" transform="rotate(-90 150 605)" text-anchor="middle">GLASS DEPTH 98.0 mm</text>

        <!-- Technical callout labels -->
        <polyline points="313,180 390,140 490,140" />
        <circle cx="313" cy="180" r="3" fill="#00a9c9" />
        <text x="500" y="145">12.0 mm TOUGHENED SAFETY GLASS (EN 12150)</text>

        <polyline points="325,580 430,550 530,550" />
        <circle cx="325" cy="580" r="3" fill="#00a9c9" />
        <text x="540" y="555">ABS PACKING &amp; EPDM WEATHER GASKET</text>

        <polyline points="312,870 410,910 510,910" />
        <circle cx="312" cy="870" r="3" fill="#00a9c9" />
        <text x="520" y="915">M12 HIGH-TENSILE EXPANSION ANCHOR @ 450 mm C/C</text>
      </g>
    </g>

    <!-- SECTION 2: FRONT ELEVATION & RAILING RUN (Right Side) -->
    <g transform="translate(1120, 260)" stroke="#00a9c9" stroke-width="1.75">
      <!-- Title block in header -->
      <g font-family="'Inter', monospace" fill="#0087a3" stroke="none">
        <text x="0" y="40" font-size="22" font-weight="700" letter-spacing="0.12em">PRISM RAIL® FABRICATION ELEVATION</text>
        <text x="0" y="70" font-size="13" opacity="0.8">SPECIFICATION DRAWING: PR-19-CP / ARCHITECTURAL MODULAR ASSEMBLY</text>
        <text x="0" y="90" font-size="12" opacity="0.7">SCALE 1:10 @ A1 · TOLERANCE ISO 2768-m · SHREENATH ENTERPRISE, RAJKOT</text>
      </g>

      <!-- Slab level -->
      <line x1="-40" y1="800" x2="1140" y2="800" stroke-width="2.5" />
      <rect x="0" y="800" width="1100" height="80" fill="url(#concrete_light)" stroke-dasharray="6,3" />

      <!-- Base channel run -->
      <rect x="20" y="720" width="1040" height="80" fill="url(#hatch_light)" stroke-width="2.5" />
      <line x1="20" y1="740" x2="1060" y2="740" stroke-width="1" />
      <!-- Bolt centers marked -->
      <circle cx="120" cy="760" r="6" stroke-width="1.5"/><line x1="110" y1="760" x2="130" y2="760"/><line x1="120" y1="750" x2="120" y2="770"/> <circle cx="320" cy="760" r="6" stroke-width="1.5"/><line x1="310" y1="760" x2="330" y2="760"/><line x1="320" y1="750" x2="320" y2="770"/> <circle cx="520" cy="760" r="6" stroke-width="1.5"/><line x1="510" y1="760" x2="530" y2="760"/><line x1="520" y1="750" x2="520" y2="770"/> <circle cx="720" cy="760" r="6" stroke-width="1.5"/><line x1="710" y1="760" x2="730" y2="760"/><line x1="720" y1="750" x2="720" y2="770"/> <circle cx="920" cy="760" r="6" stroke-width="1.5"/><line x1="910" y1="760" x2="930" y2="760"/><line x1="920" y1="750" x2="920" y2="770"/>

      <!-- Three Glass Panes with 6mm expansion gaps -->
      <!-- Pane 1 -->
      <rect x="30" y="160" width="320" height="580" fill="none" stroke-width="2" />
      <!-- Pane 2 -->
      <rect x="360" y="160" width="340" height="580" fill="none" stroke-width="2" />
      <!-- Pane 3 -->
      <rect x="710" y="160" width="340" height="580" fill="none" stroke-width="2" />

      <!-- Top Handrail Section (PR HR - 50) capping glass -->
      <rect x="15" y="130" width="1050" height="34" rx="4" fill="url(#hatch_light)" stroke-width="2" />
      
      <!-- Dimension string across panels -->
      <g stroke-width="1" font-family="'Inter', monospace" font-size="12" fill="#0087a3">
        <!-- Glass Height -->
        <line x1="1085" y1="130" x2="1085" y2="800" />
        <line x1="1075" y1="130" x2="1095" y2="130" />
        <line x1="1075" y1="800" x2="1095" y2="800" />
        <text x="1100" y="470" transform="rotate(90 1100 470)" text-anchor="middle">SYSTEM HEIGHT = 1100.0 mm</text>

        <!-- Span dimensions -->
        <line x1="30" y1="100" x2="350" y2="100" />
        <line x1="30" y1="90" x2="30" y2="110" />
        <line x1="350" y1="90" x2="350" y2="110" />
        <text x="190" y="92" text-anchor="middle">PANEL 1: 1200 mm</text>

        <line x1="360" y1="100" x2="700" y2="100" />
        <line x1="360" y1="90" x2="360" y2="110" />
        <line x1="700" y1="90" x2="700" y2="110" />
        <text x="530" y="92" text-anchor="middle">PANEL 2: 1200 mm</text>

        <line x1="710" y1="100" x2="1050" y2="100" />
        <line x1="710" y1="90" x2="710" y2="110" />
        <line x1="1050" y1="90" x2="1050" y2="110" />
        <text x="880" y="92" text-anchor="middle">PANEL 3: 1200 mm</text>
      </g>
    </g>

    <!-- SECTION 3: ENGINEERING STAMP & CERTIFICATION BLOCK (Bottom Right) -->
    <g transform="translate(1820, 1340)" stroke="#00a9c9" stroke-width="1.5" font-family="'Inter', monospace">
      <rect x="0" y="0" width="460" height="180" fill="none" stroke-width="2" />
      <line x1="0" y1="45" x2="460" y2="45" />
      <line x1="0" y1="90" x2="460" y2="90" />
      <line x1="0" y1="135" x2="460" y2="135" />
      <line x1="230" y1="45" x2="230" y2="180" />
      
      <g fill="#0087a3" stroke="none" font-size="12">
        <text x="14" y="28" font-size="15" font-weight="700" letter-spacing="0.08em">PRISM RAIL — SHREENATH ENTERPRISE</text>
        <text x="14" y="70">PROJECT: ARCHITECTURAL HARDWARE</text>
        <text x="244" y="70">SYSTEM: ALL PROFILES</text>
        <text x="14" y="115">APPROVED: CHIEF QUALITY AUDITOR</text>
        <text x="244" y="115">STATUS: CERTIFIED ISO 9001:2015</text>
        <text x="14" y="160">DOC ID: DWG-PR-2026-REV04</text>
        <text x="244" y="160">SHEET 01 / 01 · RAJKOT INDIA</text>
      </g>
    </g>
  </g>
</svg>